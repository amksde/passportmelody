<nav class="breadcrumbs" aria-label="breadcrumb">
    <ol>
        <li><a href="/">Home</a></li>
        {{ $currentPage := . }}
        {{ range .Ancestors.Reverse }}
            {{ if not .IsHome }}
                <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
            {{ end }}
        {{ end }}
        <li class="active">{{ .Title }}</li>
    </ol>
</nav>
